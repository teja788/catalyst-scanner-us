# Marquee funds / activist investors to FLAG (not endorse) when their name appears
# as the filer on a 13D/13G or Form 4 (public record). Matching is case-insensitive
# substring against the disclosed filer name. Edit freely.
#
# 13F-derived signals are quarterly/lagged (filed ~45 days after quarter-end), so
# they are marked clearly as a SLOW signal — not a "last 24h" alert.

rule: flag_any_disclosed_buy   # any 13D/13G/Form-4 match counts as significant for now

# Also flagged in code (not listed here): any insider (Form 4) OPEN-MARKET BUY,
# especially clusters, regardless of name.

investors:
  - Berkshire Hathaway          # Warren Buffett
  - Pershing Square             # Bill Ackman
  - Third Point                 # Dan Loeb
  - Elliott Management          # Paul Singer (activist)
  - Starboard Value             # (activist)
  - ValueAct Capital
